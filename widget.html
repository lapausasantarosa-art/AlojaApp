<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario — La Pausa</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:       #f4f5f8;
    --surface:  #ffffff;
    --border:   #e2e5ed;
    --text:     #1a1d23;
    --text2:    #6b7280;
    --accent:   #6d40c4;
    --red:      #dc2626;
    --red-lt:   #fee2e2;
    --radius:   10px;
    --shadow:   0 2px 10px rgba(0,0,0,.08);
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 12px;
  }

  /* ── LOGIN ── */
  #login-screen {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; margin: -12px;
  }
  .login-card {
    background: var(--surface); border-radius: 14px;
    padding: 36px 32px; width: 100%; max-width: 420px;
    text-align: center; box-shadow: 0 2px 16px rgba(0,0,0,.08);
    border: 1px solid var(--border);
  }
  .login-logo-wrap { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px; }
  .login-logo-icon {
    width: 52px; height: 52px; background: var(--accent); border-radius: 14px;
    display: flex; align-items: center; justify-content: center; font-size: 1.6rem;
  }
  .login-logo-brand { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
  .login-logo-sub   { font-size: .8rem; color: var(--text2); }
  .login-title    { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; }
  .login-subtitle { font-size: .88rem; color: var(--text2); margin-bottom: 28px; line-height: 1.5; }
  .btn-google {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 13px 20px; background: var(--accent); color: #fff;
    border: none; border-radius: 10px; font-size: 1rem; font-weight: 600;
    font-family: inherit; cursor: pointer; transition: opacity .2s;
  }
  .btn-google:hover { opacity: .88; }

  /* ── DENIED ── */
  #denied-screen {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; margin: -12px;
  }
  .denied-card {
    background: var(--surface); border-radius: 14px; padding: 36px 32px;
    width: 100%; max-width: 400px; text-align: center;
    box-shadow: 0 2px 16px rgba(0,0,0,.08); border: 2px solid var(--red);
  }
  .denied-icon  { font-size: 2.5rem; margin-bottom: 12px; }
  .denied-title { font-size: 1.2rem; font-weight: 700; color: var(--red); margin-bottom: 8px; }
  .denied-msg   { font-size: .88rem; color: var(--text2); line-height: 1.5; margin-bottom: 20px; }
  .btn-logout {
    padding: 10px 20px; background: var(--red-lt); color: var(--red);
    border: 1px solid var(--red); border-radius: 8px;
    font-family: inherit; font-size: .9rem; font-weight: 600; cursor: pointer;
  }

  /* ── LOADING ── */
  #loading-screen {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; gap: 12px; color: var(--text2); font-size: .9rem; margin: -12px;
  }
  .spinner {
    width: 28px; height: 28px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite; margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── HEADER ── */
  .widget-header {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); border-radius: var(--radius);
    padding: 10px 14px; margin-bottom: 10px;
    box-shadow: var(--shadow); border: 1px solid var(--border);
    gap: 8px; flex-wrap: wrap;
  }
  .widget-title {
    font-size: .95rem; font-weight: 700; color: var(--accent);
    display: flex; align-items: center; gap: 8px;
  }
  .nav-group { display: flex; align-items: center; gap: 6px; }
  .nav-btn {
    background: none; border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 12px; cursor: pointer; font-size: 1rem; color: var(--text);
    transition: background .15s;
  }
  .nav-btn:hover { background: var(--bg); }
  .month-label { font-size: 1rem; font-weight: 600; min-width: 140px; text-align: center; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .btn-limpieza {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 12px; background: #ede9fb; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 7px;
    font-family: inherit; font-size: .8rem; font-weight: 700;
    cursor: pointer; text-decoration: none; white-space: nowrap;
    transition: background .15s;
  }
  .btn-limpieza:hover { background: #ddd5f7; }
  .user-avatar-sm {
    width: 28px; height: 28px; border-radius: 50%; object-fit: cover;
    border: 2px solid #ede9fb; flex-shrink: 0;
  }
  .btn-signout-sm {
    font-size: .72rem; padding: 4px 9px; border: 1px solid var(--border);
    border-radius: 6px; background: transparent; color: var(--text2);
    font-family: inherit; cursor: pointer;
  }

  /* ── CALENDARIO ── */
  .cal-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); width: 100%; }
  .cal-head-cell {
    padding: 8px 4px; text-align: center; font-size: .68rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: .5px; color: var(--text2);
    background: #f8f9fb; border-bottom: 1px solid var(--border);
  }
  .cal-cell {
    min-height: 80px; padding: 5px 4px;
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    vertical-align: top; overflow: hidden;
  }
  .cal-cell:nth-child(7n) { border-right: none; }
  .cal-cell.other-month   { background: #fafafa; }
  .cal-cell.other-month .day-num { color: #ccc; }
  .cal-cell.today .day-num {
    background: var(--accent); color: #fff; border-radius: 50%;
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
  }
  .day-num {
    font-size: .75rem; font-weight: 600; width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center; margin-bottom: 3px;
  }
  .cal-event {
    border-radius: 4px; padding: 2px 5px; font-size: .65rem; font-weight: 500;
    color: #fff; margin-bottom: 2px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; cursor: default; display: block; max-width: 100%; line-height: 1.4;
  }

  /* ── LEYENDA ── */
  .legend {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 10px 14px; background: #f8f9fb; border-top: 1px solid var(--border);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: .75rem; color: var(--text2); }
  .legend-dot  { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

  /* ── POPUP ── */
  .popup-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35);
    z-index: 100; align-items: center; justify-content: center; padding: 20px;
  }
  .popup-overlay.open { display: flex; }
  .popup {
    background: #fff; border-radius: 14px; padding: 20px; width: 100%; max-width: 340px;
    box-shadow: 0 8px 32px rgba(0,0,0,.18); animation: popIn .2s ease;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.93) translateY(8px); }
    to   { opacity: 1; transform: scale(1)  translateY(0); }
  }
  .popup-aloj { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .popup-dot  { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .popup-aloj-name { font-weight: 700; font-size: .95rem; flex: 1; }
  .popup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size: .85rem; margin-bottom: 10px; }
  .popup-label { color: var(--text2); font-size: .72rem; text-transform: uppercase; letter-spacing: .4px; }
  .popup-val   { font-weight: 600; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: .72rem; font-weight: 600; }
  .badge-green  { background: #ecfdf5; color: #065f46; }
  .badge-yellow { background: #fffbeb; color: #92400e; }
  .badge-red    { background: #fef2f2; color: #991b1b; }
  .close-popup {
    display: block; width: 100%; margin-top: 14px; padding: 8px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    cursor: pointer; font-size: .88rem; font-family: 'DM Sans', sans-serif;
  }

  @media (max-width: 480px) {
    body { padding: 8px; }
    .cal-cell { min-height: 56px; padding: 3px 2px; }
    .cal-event { font-size: .58rem; padding: 1px 3px; }
    .day-num { font-size: .68rem; }
    .cal-head-cell { font-size: .6rem; padding: 6px 2px; letter-spacing: 0; }
    .month-label { font-size: .88rem; min-width: 110px; }
    .btn-limpieza span { display: none; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo-wrap">
      <div class="login-logo-icon">📅</div>
      <div>
        <div class="login-logo-brand">La Pausa</div>
        <div class="login-logo-sub">Alojamientos Temporarios</div>
      </div>
    </div>
    <div class="login-title">Calendario de Reservas</div>
    <div class="login-subtitle">Iniciá sesión con tu cuenta de Google para ver el calendario.</div>
    <button class="btn-google" id="btn-login">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#fff" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#ffffffcc" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#ffffffaa" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#ffffffdd" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
      Iniciar sesión con Google
    </button>
  </div>
</div>

<!-- ACCESO DENEGADO -->
<div id="denied-screen">
  <div class="denied-card">
    <div class="denied-icon">🚫</div>
    <div class="denied-title">Acceso Denegado</div>
    <div class="denied-msg" id="denied-msg">Tu cuenta no está habilitada. Contactá al administrador.</div>
    <button class="btn-logout" id="btn-denied-logout">Cerrar sesión</button>
  </div>
</div>

<!-- CARGANDO -->
<div id="loading-screen">
  <div class="spinner"></div>
  <span id="loading-msg">Verificando acceso…</span>
</div>

<!-- APP -->
<div id="app" style="display:none;">
  <div class="widget-header">
    <div class="widget-title">
      <span>📅</span>
      <span id="app-brand">La Pausa</span>
    </div>
    <div class="nav-group">
      <button class="nav-btn" onclick="navMes(-1)">&#8249;</button>
      <span class="month-label" id="month-label"></span>
      <button class="nav-btn" onclick="navMes(1)">&#8250;</button>
    </div>
    <div class="header-right">
      <a href="limpieza.html" class="btn-limpieza">🧹 <span>Limpieza</span></a>
      <img class="user-avatar-sm" id="user-avatar" src="" alt="">
      <button class="btn-signout-sm" id="btn-signout">Salir</button>
    </div>
  </div>

  <div class="cal-wrap">
    <div class="cal-grid" id="cal-heads"></div>
    <div class="cal-grid" id="cal-body"></div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<!-- Popup -->
<div class="popup-overlay" id="popup-overlay" onclick="cerrarPopup(event)">
  <div class="popup">
    <div class="popup-aloj">
      <div class="popup-dot" id="pop-dot"></div>
      <span class="popup-aloj-name" id="pop-aloj"></span>
      <span class="badge" id="pop-estado-badge"></span>
    </div>
    <div class="popup-grid">
      <div><div class="popup-label">Huésped</div><div class="popup-val" id="pop-nombre"></div></div>
      <div><div class="popup-label">Personas</div><div class="popup-val" id="pop-personas"></div></div>
      <div><div class="popup-label">Entrada</div><div class="popup-val" id="pop-entrada"></div></div>
      <div><div class="popup-label">Salida</div><div class="popup-val" id="pop-salida"></div></div>
      <div><div class="popup-label">Noches</div><div class="popup-val" id="pop-noches"></div></div>
      <div><div class="popup-label">Mascota</div><div class="popup-val" id="pop-mascota"></div></div>
    </div>
    <button class="close-popup" onclick="cerrarPopup()">Cerrar</button>
  </div>
</div>

<script type="module">
const FB = {
  apiKey:            "AIzaSyBe0h2TWO5oBS4WxeJVoC37PKbyz1jmJiU",
  authDomain:        "alojaapp-8ed45.firebaseapp.com",
  projectId:         "alojaapp-8ed45",
  storageBucket:     "alojaapp-8ed45.firebasestorage.app",
  messagingSenderId: "763636738474",
  appId:             "1:763636738474:web:661dd264664b468c2ae3d3"
};

import { initializeApp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, onSnapshot, doc, getDocs, getDoc }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const fireApp  = initializeApp(FB, 'widget');
const db       = getFirestore(fireApp);
const auth     = getAuth(fireApp);
const provider = new GoogleAuthProvider();

// ── Screens ──
const Scr = {
  login:   document.getElementById('login-screen'),
  denied:  document.getElementById('denied-screen'),
  loading: document.getElementById('loading-screen'),
  app:     document.getElementById('app')
};
function showScr(name) {
  var display = { login:'flex', denied:'flex', loading:'flex', app:'block' };
  Object.keys(Scr).forEach(function(k) {
    Scr[k].style.display = k === name ? display[k] : 'none';
  });
}

// ── Login / Logout ──
document.getElementById('btn-login').addEventListener('click', async function() {
  try {
    showScr('loading');
    document.getElementById('loading-msg').textContent = 'Iniciando sesión…';
    await signInWithPopup(auth, provider);
  } catch(e) {
    showScr('login');
    alert('Error al iniciar sesión: ' + e.message);
  }
});
document.getElementById('btn-signout').addEventListener('click', function() { signOut(auth); });
document.getElementById('btn-denied-logout').addEventListener('click', function() { signOut(auth); });

// ── Auth ──
onAuthStateChanged(auth, async function(user) {
  if (!user) { showScr('login'); return; }
  showScr('loading');
  document.getElementById('loading-msg').textContent = 'Verificando acceso…';
  var ok = await checkUsuario(user.email);
  if (!ok) {
    document.getElementById('denied-msg').textContent =
      'Tu cuenta (' + user.email + ') no está habilitada. Contactá al administrador.';
    showScr('denied');
    return;
  }
  document.getElementById('user-avatar').src = user.photoURL || '';
  showScr('loading');
  document.getElementById('loading-msg').textContent = 'Cargando calendario…';
  iniciarListeners();
});

async function checkUsuario(email) {
  try {
    if (email === 'lapausa.santarosa@gmail.com') return true;
    var uDoc = await getDoc(doc(db, 'usuarios', email));
    if (uDoc.exists() && uDoc.data().approved === true) return true;
    var snap = await getDocs(collection(db, 'usuarios'));
    for (var i = 0; i < snap.docs.length; i++) {
      var d = snap.docs[i];
      var data = d.data();
      var docEmail = (data.email || d.id || '').toLowerCase();
      if (docEmail === email.toLowerCase() && data.approved === true) return true;
    }
    return false;
  } catch(e) { return false; }
}

// ── Estado ──
var alojamientos = [];
var reservas     = [];
var calDate      = new Date();
var alojLoaded   = false;
var resLoaded    = false;

var MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var DAYS   = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

function fmt(iso) {
  if (!iso) return '—';
  var parts = iso.split('-');
  return parts[2] + '/' + parts[1] + '/' + parts[0];
}
function daysBetween(a, b) {
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}

function iniciarListeners() {
  onSnapshot(collection(db, 'alojamientos'), function(snap) {
    alojamientos = snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); });
    alojLoaded = true;
    if (alojLoaded && resLoaded) mostrarApp();
  });
  onSnapshot(collection(db, 'reservas'), function(snap) {
    reservas = snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); });
    resLoaded = true;
    if (alojLoaded && resLoaded) mostrarApp();
    else if (resLoaded) render();
  });
  onSnapshot(doc(db, 'config', 'branding'), function(snap) {
    if (snap.exists()) {
      var d = snap.data();
      var brand = document.getElementById('app-brand');
      if (d.logoBase64) {
        brand.innerHTML = '<img src="' + d.logoBase64 + '" style="max-height:28px;max-width:100px;object-fit:contain;vertical-align:middle;">';
      } else if (d.appNombre) {
        brand.textContent = d.appNombre;
      }
    }
  });
}

function mostrarApp() {
  showScr('app');
  render();
}

function render() {
  var year  = calDate.getFullYear();
  var month = calDate.getMonth();
  document.getElementById('month-label').textContent = MONTHS[month] + ' ' + year;

  document.getElementById('cal-heads').innerHTML =
    DAYS.map(function(d) { return '<div class="cal-head-cell">' + d + '</div>'; }).join('');

  var today    = new Date(); today.setHours(0,0,0,0);
  var todayStr = today.toISOString().split('T')[0];
  var firstDay = new Date(year, month, 1).getDay();
  var daysInM  = new Date(year, month + 1, 0).getDate();
  var prevD    = new Date(year, month, 0).getDate();

  var cells = [];
  for (var i = firstDay - 1; i >= 0; i--) {
    var d = prevD - i;
    cells.push({ day: d, cur: false, date: year + '-' + String(month).padStart(2,'0') + '-' + String(d).padStart(2,'0') });
  }
  for (var d2 = 1; d2 <= daysInM; d2++) {
    cells.push({ day: d2, cur: true, date: year + '-' + String(month+1).padStart(2,'0') + '-' + String(d2).padStart(2,'0') });
  }
  var nx = 1;
  while (cells.length % 7 !== 0) {
    cells.push({ day: nx, cur: false, date: year + '-' + String(month+2).padStart(2,'0') + '-' + String(nx).padStart(2,'0') });
    nx++;
  }

  var activeRes = reservas.filter(function(r) { return r.estado !== 'cancelada'; });

  document.getElementById('cal-body').innerHTML = cells.map(function(cell) {
    var isToday = cell.cur && cell.date === todayStr;
    var events = '';
    activeRes.forEach(function(r) {
      if (cell.date >= r.entrada && cell.date < r.salida) {
        var a     = alojamientos.find(function(a) { return a.id === r.alojId; });
        var color = (a && a.color) ? a.color : '#888';
        var nombreAloj = (a && a.nombre ? a.nombre : '').replace(/departamento/gi, 'Dpto.');
        var isEntrada  = cell.date === r.entrada;
        var personas   = r.adultos ? (r.adultos + (r.menores || 0)) : (r.personas || '');
        var mascota    = (r.mascota === 'si') ? ' 🐾' : '';
        var primerNombre = r.nombre ? r.nombre.split(' ')[0] : '';
        var label = isEntrada
          ? ('🔑 ' + primerNombre + ' · ' + personas + 'p' + mascota)
          : ('· ' + personas + 'p' + mascota);
        events += '<div class="cal-event" style="background:' + color + ';" onclick="window.verDetalle(\'' + r.id + '\')" title="' + r.nombre + ' — ' + nombreAloj + '">' + label + '</div>';
      }
    });
    return '<div class="cal-cell ' + (!cell.cur ? 'other-month' : '') + ' ' + (isToday ? 'today' : '') + '"><div class="day-num">' + cell.day + '</div>' + events + '</div>';
  }).join('');

  var mesStr = year + '-' + String(month+1).padStart(2,'0');
  var alojConRes = alojamientos.filter(function(a) {
    return activeRes.some(function(r) {
      return r.alojId === a.id && (
        (r.entrada && r.entrada.startsWith(mesStr)) ||
        (r.salida  && r.salida.startsWith(mesStr))
      );
    });
  });
  document.getElementById('legend').innerHTML = alojConRes.map(function(a) {
    return '<div class="legend-item"><div class="legend-dot" style="background:' + a.color + '"></div><span>' + (a.nombre||'').replace(/departamento/gi,'Dpto.') + '</span></div>';
  }).join('') || '<span style="font-size:.75rem;color:#aaa;">Sin reservas este mes</span>';
}

window.navMes = function(dir) {
  calDate = new Date(calDate.getFullYear(), calDate.getMonth() + dir, 1);
  render();
};

window.verDetalle = function(id) {
  var r = reservas.find(function(r) { return r.id === id; });
  if (!r) return;
  var a  = alojamientos.find(function(a) { return a.id === r.alojId; });
  var eb = { confirmada:'badge-green', pendiente:'badge-yellow', cancelada:'badge-red' }[r.estado] || 'badge-green';
  document.getElementById('pop-dot').style.background    = (a && a.color) ? a.color : '#888';
  document.getElementById('pop-aloj').textContent        = (a && a.nombre ? a.nombre : '?').replace(/departamento/gi,'Dpto.');
  document.getElementById('pop-estado-badge').textContent= r.estado;
  document.getElementById('pop-estado-badge').className  = 'badge ' + eb;
  document.getElementById('pop-nombre').textContent      = r.nombre || '—';
  var personas = r.adultos ? (r.adultos + (r.menores || 0)) : (r.personas || '—');
  document.getElementById('pop-personas').textContent    = personas + ((r.mascota === 'si') ? ' 🐾' : '');
  document.getElementById('pop-entrada').textContent     = fmt(r.entrada);
  document.getElementById('pop-salida').textContent      = fmt(r.salida);
  document.getElementById('pop-noches').textContent      = daysBetween(r.entrada, r.salida) + ' noches';
  document.getElementById('pop-mascota').textContent     = r.mascota === 'si' ? '🐾 Sí' : 'No';
  document.getElementById('popup-overlay').classList.add('open');
};

window.cerrarPopup = function(e) {
  if (!e || e.target === document.getElementById('popup-overlay')) {
    document.getElementById('popup-overlay').classList.remove('open');
  }
};
</script>
</body>
