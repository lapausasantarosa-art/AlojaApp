<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limpieza del Día — La Pausa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #f4f5f7;
    --card-bg:   #ffffff;
    --border:    #e3e5ea;
    --text:      #1a1d23;
    --text2:     #6b7280;
    --accent:    #6d40c4;
    --accent-lt: #ede9fb;
    --green:     #16a34a;
    --green-lt:  #dcfce7;
    --yellow:    #d97706;
    --yellow-lt: #fef3c7;
    --red:       #dc2626;
    --red-lt:    #fee2e2;
    --blue:      #2563eb;
    --blue-lt:   #dbeafe;
    --radius:    14px;
  }

  html, body {
    min-height: 100%;
    background: var(--bg);
    font-family: 'DM Sans', -apple-system, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ── LOGIN SCREEN ── */
  #login-screen {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; padding: 24px; gap: 24px;
  }
  .login-card {
    background: var(--card-bg); border-radius: var(--radius);
    padding: 36px 32px; width: 100%; max-width: 420px;
    text-align: center; box-shadow: 0 2px 16px rgba(0,0,0,.08);
    border: 1px solid var(--border);
  }
  .login-logo-wrap { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px; }
  .login-logo-icon {
    width: 56px; height: 56px; background: var(--accent); border-radius: 16px;
    display: flex; align-items: center; justify-content: center; font-size: 1.8rem; flex-shrink: 0;
  }
  .login-logo-text { text-align: left; }
  .login-logo-brand { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
  .login-logo-sub   { font-size: .8rem; color: var(--text2); }
  .login-title { font-size: 1.3rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .login-subtitle { font-size: .9rem; color: var(--text2); margin-bottom: 28px; line-height: 1.5; }
  .btn-google {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 13px 20px; background: var(--accent); color: #fff;
    border: none; border-radius: 10px; font-size: 1rem; font-weight: 600;
    font-family: inherit; cursor: pointer; transition: opacity .2s;
  }
  .btn-google:hover { opacity: .88; }

  /* ── ACCESS DENIED ── */
  #denied-screen {
    display: none; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; padding: 24px;
  }
  .denied-card {
    background: var(--card-bg); border-radius: var(--radius); padding: 36px 32px;
    width: 100%; max-width: 400px; text-align: center;
    box-shadow: 0 2px 16px rgba(0,0,0,.08); border: 2px solid var(--red);
  }
  .denied-icon  { font-size: 2.5rem; margin-bottom: 12px; }
  .denied-title { font-size: 1.2rem; font-weight: 700; color: var(--red); margin-bottom: 8px; }
  .denied-msg   { font-size: .9rem; color: var(--text2); line-height: 1.5; margin-bottom: 20px; }
  .btn-logout {
    padding: 10px 20px; background: var(--red-lt); color: var(--red);
    border: 1px solid var(--red); border-radius: 8px; font-family: inherit;
    font-size: .9rem; font-weight: 600; cursor: pointer;
  }

  /* ── LOADING ── */
  #loading-screen {
    display: none; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; gap: 12px;
    color: var(--text2); font-size: .9rem;
  }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── MAIN APP ── */
  #app { display: none; }

  /* HEADER */
  .app-header {
    background: var(--card-bg); border-bottom: 1px solid var(--border);
    padding: 14px 20px; position: sticky; top: 0; z-index: 10;
    box-shadow: 0 1px 6px rgba(0,0,0,.06);
  }
  .app-header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .app-header-brand { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
  .header-logo-box {
    width: 46px; height: 46px; background: var(--accent); border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0;
  }
  .header-brand-info { min-width: 0; }
  .header-brand-name  { font-size: 1rem; font-weight: 700; color: var(--accent); line-height: 1.2; }
  .header-brand-title { font-size: .78rem; color: var(--text2); line-height: 1.2; }

  /* Fecha grande centrada */
  .header-date-bar { text-align: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .header-date-main { font-size: 1.15rem; font-weight: 700; color: var(--text); text-transform: capitalize; }
  .header-date-sub  { font-size: .8rem; color: var(--text2); margin-top: 1px; }

  /* Nav de fecha */
  .date-nav { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 8px; }
  .btn-nav {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--bg); color: var(--accent); font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background .15s, border-color .15s; flex-shrink: 0;
  }
  .btn-nav:hover { background: var(--accent-lt); border-color: var(--accent); }
  .btn-nav:disabled { opacity: .35; cursor: default; }
  .date-nav-label {
    font-size: .88rem; font-weight: 600; color: var(--text);
    min-width: 140px; text-align: center; text-transform: capitalize;
  }
  .date-badge-hoy {
    display: inline-block; font-size: .65rem; font-weight: 700;
    background: var(--accent); color: #fff; padding: 1px 7px;
    border-radius: 20px; margin-left: 6px; vertical-align: middle; letter-spacing: .3px;
  }
  .date-badge-pasado {
    display: inline-block; font-size: .65rem; font-weight: 700;
    background: var(--yellow-lt); color: var(--yellow);
    padding: 1px 7px; border-radius: 20px; margin-left: 6px; vertical-align: middle;
  }
  .date-badge-futuro {
    display: inline-block; font-size: .65rem; font-weight: 700;
    background: var(--blue-lt); color: var(--blue);
    padding: 1px 7px; border-radius: 20px; margin-left: 6px; vertical-align: middle;
  }

  /* Botones de acción del header */
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .btn-hdr {
    display: flex; align-items: center; gap: 5px; padding: 7px 12px;
    background: var(--accent-lt); color: var(--accent);
    border: 1px solid var(--accent); border-radius: 8px; font-family: inherit;
    font-size: .8rem; font-weight: 700; cursor: pointer; text-decoration: none;
    transition: background .15s; white-space: nowrap;
  }
  .btn-hdr:hover { background: #ddd5f7; }
  .btn-hdr-volver {
    display: none; align-items: center; gap: 5px; padding: 7px 12px;
    background: var(--bg); color: var(--text2);
    border: 1px solid var(--border); border-radius: 8px; font-family: inherit;
    font-size: .8rem; font-weight: 700; cursor: pointer;
  }
  .btn-hdr-volver:hover { background: var(--border); }
  .user-avatar {
    width: 34px; height: 34px; border-radius: 50%; object-fit: cover;
    border: 2px solid var(--accent-lt); flex-shrink: 0;
  }
  .btn-signout {
    font-size: .75rem; padding: 5px 10px; border: 1px solid var(--border);
    border-radius: 6px; background: transparent; color: var(--text2);
    font-family: inherit; cursor: pointer;
  }

  /* ── BODY ── */
  .app-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; max-width: 700px; margin: 0 auto; }

  /* ── CARDS LIMPIEZA ── */
  .aloj-card {
    background: var(--card-bg); border-radius: var(--radius);
    border: 1px solid var(--border); overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }
  .aloj-card-header { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--border); }
  .aloj-color-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .aloj-nombre { font-size: 1rem; font-weight: 700; flex: 1; }
  .aloj-card-body { padding: 13px 16px; display: flex; flex-direction: column; gap: 8px; }

  .badge {
    display: inline-block; font-size: .7rem; font-weight: 700;
    padding: 3px 9px; border-radius: 20px; letter-spacing: .3px; white-space: nowrap;
  }
  .badge-limpiar  { background: var(--yellow-lt); color: var(--yellow); }
  .badge-preparar { background: var(--blue-lt);   color: var(--blue);   }
  .badge-nada     { background: var(--green-lt);  color: var(--green);  }

  .status-row { display: flex; align-items: flex-start; gap: 8px; }
  .status-icon { font-size: 1.05rem; flex-shrink: 0; margin-top: 2px; }
  .status-text { font-size: .92rem; line-height: 1.45; font-weight: 500; }

  .tag-pet {
    background: var(--yellow-lt); border-left: 3px solid var(--yellow);
    border-radius: 6px; padding: 8px 12px; font-size: .85rem; color: var(--yellow);
    font-weight: 600; display: flex; align-items: center; gap: 6px;
  }
  .tag-plataforma {
    background: #fff8ed; border-left: 3px solid var(--yellow); border-radius: 6px;
    padding: 8px 12px; font-size: .85rem; color: var(--yellow);
    font-weight: 600; display: flex; align-items: center; gap: 6px; line-height: 1.35;
  }
  .footer-btns {
    display: flex; justify-content: center; gap: 10px; padding: 8px 0 20px; flex-wrap: wrap;
  }
  .btn-refresh {
    display: flex; align-items: center; gap: 6px; padding: 9px 16px;
    background: var(--accent-lt); color: var(--accent); border: 1px solid var(--accent);
    border-radius: 8px; font-family: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
  }

  /* ── SIGUE OCUPADO ── */
  .tag-continua {
    background: #ecfdf5; border-left: 3px solid var(--green); border-radius: 6px;
    padding: 10px 13px; font-size: .88rem; color: var(--green); font-weight: 700;
    display: flex; align-items: center; gap: 7px; line-height: 1.35;
  }

  /* ── OBSERVACIONES DE RESERVA ── */
  .tag-obs-reserva {
    background: var(--accent-lt); border-left: 3px solid var(--accent);
    border-radius: 6px; padding: 8px 12px; font-size: .85rem; line-height: 1.4;
  }
  .tag-obs-reserva-label {
    font-size: .7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .4px; color: var(--accent); margin-bottom: 3px;
  }
  .tag-obs-reserva-text { color: var(--text); }

  /* ── OBSERVACIONES LIMPIEZA CARGADAS ── */
  .tag-obs-limp-list {
    background: #f0fdf4; border-left: 3px solid var(--green);
    border-radius: 6px; padding: 8px 12px; font-size: .83rem; line-height: 1.4;
  }
  .tag-obs-limp-label {
    font-size: .7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .4px; color: var(--green); margin-bottom: 4px;
  }
  .obs-limp-item { color: var(--text); margin-bottom: 3px; display: flex; gap: 6px; }
  .obs-limp-meta { font-size: .72rem; color: var(--text2); white-space: nowrap; }

  /* ── PANEL CARGA OBSERVACIÓN ── */
  .obs-panel {
    border-top: 1px solid var(--border); padding: 10px 16px 13px;
    display: flex; flex-direction: column; gap: 7px;
  }
  .obs-panel-label { font-size: .72rem; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .4px; }
  .obs-textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px;
    font-family: inherit; font-size: .87rem; color: var(--text); resize: vertical;
    min-height: 64px; background: var(--bg); transition: border-color .15s; line-height: 1.45;
  }
  .obs-textarea:focus { outline: none; border-color: var(--accent); background: #fff; }
  .obs-btn-row { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
  .btn-obs-guardar {
    padding: 7px 16px; background: var(--accent); color: #fff; border: none;
    border-radius: 7px; font-family: inherit; font-size: .85rem; font-weight: 700;
    cursor: pointer; transition: opacity .2s;
  }
  .btn-obs-guardar:hover { opacity: .88; }
  .btn-obs-guardar:disabled { opacity: .5; cursor: default; }
  .obs-feedback { font-size: .78rem; color: var(--green); font-weight: 600; display: none; }

  /* ══════════════════════════════════════
     ── VISTA CALENDARIO ──
  ══════════════════════════════════════ */
  #vista-calendario { display: none; }
  .cal-wrap { padding: 16px; max-width: 900px; margin: 0 auto; }
  .cal-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; gap: 8px;
  }
  .cal-mes-label { font-size: 1.1rem; font-weight: 700; color: var(--text); text-transform: capitalize; }
  .btn-cal-nav {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--accent); font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background .15s;
  }
  .btn-cal-nav:hover { background: var(--accent-lt); }

  .cal-leyenda {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;
  }
  .cal-ley-item {
    display: flex; align-items: center; gap: 5px; font-size: .75rem; color: var(--text2);
  }
  .cal-ley-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  .cal-grid-header {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 2px; margin-bottom: 4px;
  }
  .cal-dia-nombre {
    text-align: center; font-size: .7rem; font-weight: 700;
    color: var(--text2); text-transform: uppercase; letter-spacing: .3px; padding: 4px 0;
  }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
  }
  .cal-celda {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 4px 4px; min-height: 72px; position: relative;
    display: flex; flex-direction: column; gap: 2px;
  }
  .cal-celda.otro-mes { background: #fafafa; }
  .cal-celda.hoy { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .cal-num {
    font-size: .78rem; font-weight: 700; color: var(--text2);
    line-height: 1; margin-bottom: 2px; text-align: right; padding-right: 2px;
  }
  .cal-celda.hoy .cal-num { color: var(--accent); }
  .cal-celda.otro-mes .cal-num { color: #d1d5db; }
  .cal-evento {
    font-size: .65rem; font-weight: 600; padding: 2px 4px; border-radius: 4px;
    color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1.3;
  }
  .cal-evento.entrada { border-left: 3px solid rgba(0,0,0,.2); }
  .cal-evento.salida  { opacity: .75; }
  .cal-evento.medio   { border-radius: 0 4px 4px 0; }

  /* ══════════════════════════════════════
     ── VISTA CLAVES ──
  ══════════════════════════════════════ */
  #vista-claves { display: none; }
  .claves-wrap { padding: 16px; max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .claves-titulo {
    font-size: .78rem; font-weight: 700; color: var(--text2);
    text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px;
  }
  .clave-card {
    background: var(--card-bg); border-radius: var(--radius);
    border: 1px solid var(--border); overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }
  .clave-card-header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  .clave-card-body { padding: 13px 16px; display: flex; flex-direction: column; gap: 10px; }
  .clave-campo-label {
    font-size: .7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .4px; color: var(--text2); margin-bottom: 3px;
  }
  .clave-valor {
    font-size: 1.05rem; font-weight: 700; color: var(--accent);
    background: var(--accent-lt); border-radius: 8px; padding: 10px 14px;
    letter-spacing: .5px; display: flex; align-items: center; gap: 8px;
    cursor: pointer; transition: background .15s; user-select: all;
  }
  .clave-valor:hover { background: #ddd5f7; }
  .clave-valor-icon { font-size: 1.2rem; flex-shrink: 0; }
  .clave-texto-libre {
    font-size: .88rem; color: var(--text); line-height: 1.5;
    background: var(--bg); border-radius: 8px; padding: 10px 14px;
    white-space: pre-wrap;
  }
  .clave-sin-dato { font-size: .88rem; color: var(--text2); font-style: italic; }

  /* ── RESPONSIVE ── */
  @media (max-width: 480px) {
    .app-body { padding: 10px; gap: 10px; }
    .header-date-main { font-size: 1rem; }
    .date-nav-label { min-width: 110px; font-size: .82rem; }
    .btn-hdr span { display: none; }
    .cal-celda { min-height: 56px; }
    .cal-evento { font-size: .6rem; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo-wrap">
      <div class="login-logo-icon">🧹</div>
      <div class="login-logo-text">
        <div class="login-logo-brand">La Pausa</div>
        <div class="login-logo-sub">Alojamientos Temporarios</div>
      </div>
    </div>
    <div class="login-title">Panel de Limpieza</div>
    <div class="login-subtitle">Iniciá sesión con tu cuenta de Google para ver qué hay que limpiar y preparar cada día.</div>
    <button class="btn-google" id="btn-login">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#fff" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#ffffffcc" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#ffffffaa" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#ffffffdd" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
      Iniciar sesión con Google
    </button>
  </div>
</div>

<!-- ACCESO DENEGADO -->
<div id="denied-screen">
  <div class="denied-card">
    <div class="denied-icon">🚫</div>
    <div class="denied-title">Acceso Denegado</div>
    <div class="denied-msg" id="denied-msg">Tu cuenta no está habilitada. Contactá al administrador.</div>
    <button class="btn-logout" id="btn-denied-logout">Cerrar sesión</button>
  </div>
</div>

<!-- CARGANDO -->
<div id="loading-screen">
  <div class="spinner"></div>
  <span id="loading-msg">Verificando acceso…</span>
</div>

<!-- APP -->
<div id="app">

  <!-- HEADER (compartido por las 3 vistas) -->
  <div class="app-header">
    <div class="app-header-top">
      <div class="app-header-brand">
        <div class="header-logo-box" id="header-logo-icon">🧹</div>
        <div class="header-brand-info">
          <div class="header-brand-name">La Pausa</div>
          <div class="header-brand-title" id="header-subtitulo">Panel de Limpieza</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-hdr-volver" id="btn-volver" onclick="irALimpieza()">&#8592; Volver</button>
        <button class="btn-hdr" id="btn-hdr-cal" onclick="irACalendario()">📅 <span>Calendario</span></button>
        <button class="btn-hdr" id="btn-hdr-claves" onclick="irAClaves()">🔑 <span>Claves</span></button>
        <img class="user-avatar" id="user-avatar" src="" alt="">
        <button class="btn-signout" id="btn-signout">Salir</button>
      </div>
    </div>

    <!-- Fecha grande (solo en vista limpieza) -->
    <div id="header-date-zone">
      <div class="header-date-bar">
        <div class="header-date-main" id="header-date-main"></div>
        <div class="header-date-sub" id="header-date-sub"></div>
      </div>
      <div class="date-nav">
        <button class="btn-nav" id="btn-prev" title="Día anterior">&#8592;</button>
        <div class="date-nav-label" id="date-nav-label">Hoy</div>
        <button class="btn-nav" id="btn-next" title="Día siguiente">&#8594;</button>
      </div>
    </div>
  </div>

  <!-- VISTA: LIMPIEZA -->
  <div id="vista-limpieza">

function renderCalendario() {
  const hoyStr  = isoFecha(new Date());
  const activas = reservasData.filter(r => r.estado !== 'cancelada' && r.estado !== 'bloqueado');
  const alojOrdenados = [...alojamientosData].sort((a, b) =>
    (a.nombre || '').localeCompare(b.nombre || '', 'es')
  );

  // Título del mes
  const nombreMes = new Date(calAnio, calMes, 1).toLocaleDateString('es-AR', { month: 'long', year: 'numeric' });
  document.getElementById('cal-mes-label').textContent =
    nombreMes.charAt(0).toUpperCase() + nombreMes.slice(1);

  // Leyenda de alojamientos
  const leyendaEl = document.getElementById('cal-leyenda');
  leyendaEl.innerHTML = alojOrdenados.map(function(a) {
    return (
      '<div class="cal-ley-item">' +
        '<div class="cal-ley-dot" style="background:' + (a.color || '#6d40c4') + '"></div>' +
        '<span>' + escHtml(a.nombre || a.id) + '</span>' +
      '</div>'
    );
  }).join('');

  // Primer día del mes y cantidad de días
  const primerDia    = new Date(calAnio, calMes, 1).getDay(); // 0=Dom
  const diasEnMes    = new Date(calAnio, calMes + 1, 0).getDate();
  const mesPrevDias  = new Date(calAnio, calMes, 0).getDate();

  // Celdas: completar semana inicial con días del mes anterior
  const celdas = [];
  for (var p = primerDia - 1; p >= 0; p--) {
    celdas.push({ dia: mesPrevDias - p, esMes: false });
  }
  for (var d = 1; d <= diasEnMes; d++) {
    celdas.push({ dia: d, esMes: true });
  }
  // Completar hasta múltiplo de 7
  var resto = celdas.length % 7;
  if (resto !== 0) {
    for (var s = 1; s <= 7 - resto; s++) {
      celdas.push({ dia: s, esMes: false });
    }
  }

  // Construir HTML
  const gridEl = document.getElementById('cal-grid');
  var html = '';
  celdas.forEach(function(celda) {
    var mesReal  = celda.esMes ? calMes : (celda.dia > 20 ? calMes - 1 : calMes + 1);
    var anioReal = calAnio;
    if (mesReal < 0)  { mesReal = 11; anioReal--; }
    if (mesReal > 11) { mesReal = 0;  anioReal++; }

    var isoD = anioReal + '-' + String(mesReal + 1).padStart(2,'0') + '-' + String(celda.dia).padStart(2,'0');
    var esHoy = isoD === hoyStr;
    var clsCelda = 'cal-celda' + (celda.esMes ? '' : ' otro-mes') + (esHoy ? ' hoy' : '');

    // Reservas que incluyen este día
    var eventosHtml = '';
    alojOrdenados.forEach(function(aloj) {
      activas.forEach(function(res) {
        if (res.alojId !== aloj.id) return;
        if (!res.entrada || !res.salida) return;
        if (isoD < res.entrada || isoD >= res.salida) return;
        var color = aloj.color || '#6d40c4';
        var esEntrada = isoD === res.entrada;
        var esSalida  = isoD === isoFechaMenos1(res.salida); // último día ocupado
        var cls = 'cal-evento' + (esEntrada ? ' entrada' : (esSalida ? ' salida' : ' medio'));
        var label = esEntrada ? ('↘ ' + escHtml(aloj.nombre || aloj.id)) : (esSalida ? ('↗ ' + escHtml(aloj.nombre || aloj.id)) : escHtml(aloj.nombre || aloj.id));
        eventosHtml += '<div class="' + cls + '" style="background:' + color + '" title="' + escHtml(aloj.nombre || aloj.id) + '">' + label + '</div>';
      });
    });

    html += '<div class="' + clsCelda + '"><div class="cal-num">' + celda.dia + '</div>' + eventosHtml + '</div>';
  });

  gridEl.innerHTML = html;
}

// Devuelve la iso del día anterior a una iso dada
function isoFechaMenos1(isoStr) {
  if (!isoStr) return '';
  var d = new Date(isoStr + 'T00:00:00');
  d.setDate(d.getDate() - 1);
  return isoFecha(d);
}

// ════════════════════════════════════════
// VISTA: CLAVES
// ════════════════════════════════════════
function renderClaves() {
  const wrap = document.getElementById('claves-wrap');
  const ordenados = [...alojamientosData].sort((a, b) =>
    (a.nombre || '').localeCompare(b.nombre || '', 'es')
  );

  if (ordenados.length === 0) {
    wrap.innerHTML = '<div style="text-align:center;padding:40px;color:#6b7280;">No hay alojamientos cargados.</div>';
    return;
  }

  var html = '<div class="claves-titulo">🔑 Claves y accesos por alojamiento</div>';

  ordenados.forEach(function(aloj) {
    var nombre = aloj.nombre || aloj.id;
    var color  = aloj.color  || '#6d40c4';

    // Buscar el campo de clave — puede llamarse de varias formas
    var clave = aloj.clave || aloj.codigoAcceso || aloj.codigo || aloj.acceso || aloj.password || aloj.pin || '';
    var instrucciones = aloj.instruccionesAcceso || aloj.instrucciones || aloj.notasAcceso || aloj.notas || '';

    var bodyHtml = '';

    if (clave) {
      bodyHtml += (
        '<div>' +
          '<div class="clave-campo-label">Código / Clave</div>' +
          '<div class="clave-valor" title="Tocar para seleccionar">' +
            '<span class="clave-valor-icon">🔐</span>' +
            '<span>' + escHtml(String(clave)) + '</span>' +
          '</div>' +
        '</div>'
      );
    }

    if (instrucciones) {
      bodyHtml += (
        '<div>' +
          '<div class="clave-campo-label">Instrucciones de acceso</div>' +
          '<div class="clave-texto-libre">' + escHtml(String(instrucciones)) + '</div>' +
        '</div>'
      );
    }

    if (!clave && !instrucciones) {
      bodyHtml += '<div class="clave-sin-dato">No hay clave ni instrucciones de acceso cargadas para este alojamiento.</div>';
    }

    html += (
      '<div class="clave-card">' +
        '<div class="clave-card-header">' +
          '<div class="aloj-color-dot" style="background:' + color + '"></div>' +
          '<div class="aloj-nombre">' + escHtml(nombre) + '</div>' +
        '</div>' +
        '<div class="clave-card-body">' + bodyHtml + '</div>' +
      '</div>'
    );
  });

  wrap.innerHTML = html;
}

// ════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════
function fechaConOffset(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d;
}

function isoFecha(d) {
  const y   = d.getFullYear();
  const m   = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatFechaCorta(isoStr) {
  if (!isoStr) return '';
  const parts = isoStr.split('-');
  if (parts.length < 3) return isoStr;
  return parts[2] + '/' + parts[1] + '/' + parts[0];
}

// ════════════════════════════════════════
// GUARDAR OBSERVACIÓN DE LIMPIEZA
// ════════════════════════════════════════
async function guardarObs(reservaId, textareaId, btnId, feedbackId) {
  const textarea = document.getElementById(textareaId);
  const btn      = document.getElementById(btnId);
  const feedback = document.getElementById(feedbackId);
  if (!textarea) return;
  const texto = textarea.value.trim();
  if (!texto) { textarea.focus(); return; }

  btn.disabled = true;
  btn.textContent = 'Guardando…';

  try {
    const user  = auth.currentUser;
    const autor = user ? (user.displayName || user.email || '') : '';
    const fecha = isoFecha(new Date());
    const nuevaObs = { texto: texto, fecha: fecha, autor: autor };

    await updateDoc(doc(db, 'reservas', reservaId), {
      observacionesLimpieza: arrayUnion(nuevaObs)
    });

    const idx = reservasData.findIndex(r => r.id === reservaId);
    if (idx >= 0) {
      if (!reservasData[idx].observacionesLimpieza) reservasData[idx].observacionesLimpieza = [];
      reservasData[idx].observacionesLimpieza.push(nuevaObs);
    }

    textarea.value = '';
    feedback.style.display = 'inline';
    btn.textContent = 'Guardar';
    btn.disabled = false;

    renderCards(alojamientosData, reservasData);

    try {
      const res  = reservasData.find(r => r.id === reservaId);
      const aloj = alojamientosData.find(a => a.id === (res && res.alojId));
      await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
        alojamiento: (aloj && aloj.nombre) ? aloj.nombre : reservaId,
        observacion: texto,
        autor:       autor || 'Personal de limpieza',
        fecha:       fecha,
        reserva_id:  reservaId
      });
    } catch(mailErr) {
      console.warn('Mail no enviado:', mailErr);
    }

  } catch(e) {
    console.error('Error guardando observación:', e);
    btn.textContent = 'Guardar';
    btn.disabled = false;
    alert('Error al guardar: ' + e.message);
  }
}
window.guardarObs = guardarObs;
</script>
