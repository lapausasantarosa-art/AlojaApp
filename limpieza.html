<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limpieza del Día — La Pausa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #f4f5f7;
    --card-bg:   #ffffff;
    --border:    #e3e5ea;
    --text:      #1a1d23;
    --text2:     #6b7280;
    --accent:    #6d40c4;
    --accent-lt: #ede9fb;
    --green:     #16a34a;
    --green-lt:  #dcfce7;
    --yellow:    #d97706;
    --yellow-lt: #fef3c7;
    --red:       #dc2626;
    --red-lt:    #fee2e2;
    --blue:      #2563eb;
    --blue-lt:   #dbeafe;
    --radius:    14px;
  }

  html, body {
    min-height: 100%;
    background: var(--bg);
    font-family: 'DM Sans', -apple-system, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ── LOGIN SCREEN ── */
  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    gap: 24px;
  }
  .login-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 36px 32px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 2px 16px rgba(0,0,0,.08);
    border: 1px solid var(--border);
  }
  .login-logo-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .login-logo-icon {
    width: 56px; height: 56px;
    background: var(--accent);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem;
    flex-shrink: 0;
  }
  .login-logo-text { text-align: left; }
  .login-logo-brand { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
  .login-logo-sub   { font-size: .8rem; color: var(--text2); }
  .login-title {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
  }
  .login-subtitle {
    font-size: .9rem;
    color: var(--text2);
    margin-bottom: 28px;
    line-height: 1.5;
  }
  .btn-google {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 13px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: opacity .2s;
  }
  .btn-google:hover { opacity: .88; }

  /* ── ACCESS DENIED ── */
  #denied-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .denied-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 36px 32px;
    width: 100%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 2px 16px rgba(0,0,0,.08);
    border: 2px solid var(--red);
  }
  .denied-icon  { font-size: 2.5rem; margin-bottom: 12px; }
  .denied-title { font-size: 1.2rem; font-weight: 700; color: var(--red); margin-bottom: 8px; }
  .denied-msg   { font-size: .9rem; color: var(--text2); line-height: 1.5; margin-bottom: 20px; }
  .btn-logout {
    padding: 10px 20px;
    background: var(--red-lt);
    color: var(--red);
    border: 1px solid var(--red);
    border-radius: 8px;
    font-family: inherit;
    font-size: .9rem;
    font-weight: 600;
    cursor: pointer;
  }

  /* ── LOADING ── */
  #loading-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 12px;
    color: var(--text2);
    font-size: .9rem;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── MAIN APP ── */
  #app { display: none; }

  /* HEADER */
  .app-header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 1px 6px rgba(0,0,0,.06);
  }
  .app-header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .app-header-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    min-width: 0;
  }
  .header-logo-box {
    width: 46px; height: 46px;
    background: var(--accent);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    flex-shrink: 0;
  }
  .header-brand-info { min-width: 0; }
  .header-brand-name  { font-size: 1rem; font-weight: 700; color: var(--accent); line-height: 1.2; }
  .header-brand-title { font-size: .78rem; color: var(--text2); line-height: 1.2; }

  /* Fecha grande centrada */
  .header-date-bar {
    text-align: center;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .header-date-main {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text);
    text-transform: capitalize;
  }
  .header-date-sub {
    font-size: .8rem;
    color: var(--text2);
    margin-top: 1px;
  }

  /* Nav de fecha */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 8px;
  }
  .btn-nav {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--accent);
    font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    flex-shrink: 0;
  }
  .btn-nav:hover { background: var(--accent-lt); border-color: var(--accent); }
  .btn-nav:disabled { opacity: .35; cursor: default; }
  .date-nav-label {
    font-size: .88rem;
    font-weight: 600;
    color: var(--text);
    min-width: 140px;
    text-align: center;
    text-transform: capitalize;
  }
  .date-badge-hoy {
    display: inline-block;
    font-size: .65rem;
    font-weight: 700;
    background: var(--accent);
    color: #fff;
    padding: 1px 7px;
    border-radius: 20px;
    margin-left: 6px;
    vertical-align: middle;
    letter-spacing: .3px;
  }
  .date-badge-pasado {
    display: inline-block;
    font-size: .65rem;
    font-weight: 700;
    background: var(--yellow-lt);
    color: var(--yellow);
    padding: 1px 7px;
    border-radius: 20px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .date-badge-futuro {
    display: inline-block;
    font-size: .65rem;
    font-weight: 700;
    background: var(--blue-lt);
    color: var(--blue);
    padding: 1px 7px;
    border-radius: 20px;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* Botones de acción del header */
  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-widget {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 7px 12px;
    background: var(--accent-lt);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 8px;
    font-family: inherit;
    font-size: .8rem;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    transition: background .15s;
  }
  .btn-widget:hover { background: #ddd5f7; }
  .user-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--accent-lt);
    flex-shrink: 0;
  }
  .btn-signout {
    font-size: .75rem;
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text2);
    font-family: inherit;
    cursor: pointer;
  }

  /* ── BODY ── */
  .app-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; max-width: 700px; margin: 0 auto; }

  /* ── CARDS ── */
  .aloj-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }
  .aloj-card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
  }
  .aloj-color-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .aloj-nombre { font-size: 1rem; font-weight: 700; flex: 1; }
  .aloj-card-body { padding: 13px 16px; display: flex; flex-direction: column; gap: 8px; }

  .badge {
    display: inline-block;
    font-size: .7rem;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 20px;
    letter-spacing: .3px;
    white-space: nowrap;
  }
  .badge-limpiar  { background: var(--yellow-lt); color: var(--yellow); }
  .badge-preparar { background: var(--blue-lt);   color: var(--blue);   }
  .badge-nada     { background: var(--green-lt);  color: var(--green);  }

  .status-row { display: flex; align-items: flex-start; gap: 8px; }
  .status-icon { font-size: 1.05rem; flex-shrink: 0; margin-top: 2px; }
  .status-text { font-size: .92rem; line-height: 1.45; font-weight: 500; }

  .tag-obs {
    background: var(--accent-lt);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: .85rem;
    color: var(--accent);
    line-height: 1.4;
  }
  .tag-pet {
    background: var(--yellow-lt);
    border-left: 3px solid var(--yellow);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: .85rem;
    color: var(--yellow);
    font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .tag-plataforma {
    background: #fff8ed;
    border-left: 3px solid var(--yellow);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: .85rem;
    color: var(--yellow);
    font-weight: 600;
    display: flex; align-items: center; gap: 6px;
    line-height: 1.35;
  }

  /* Botón de abajo */
  .footer-btns {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 8px 0 20px;
    flex-wrap: wrap;
  }
  .btn-refresh {
    display: flex; align-items: center; gap: 6px;
    padding: 9px 16px;
    background: var(--accent-lt);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 8px;
    font-family: inherit;
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-cal-footer {
    display: flex; align-items: center; gap: 6px;
    padding: 9px 16px;
    background: var(--card-bg);
    color: var(--text2);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 480px) {
    .app-body { padding: 10px; gap: 10px; }
    .header-date-main { font-size: 1rem; }
    .date-nav-label { min-width: 110px; font-size: .82rem; }
    .btn-widget span { display: none; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo-wrap">
      <div class="login-logo-icon">🧹</div>
      <div class="login-logo-text">
        <div class="login-logo-brand">La Pausa</div>
        <div class="login-logo-sub">Alojamientos Temporarios</div>
      </div>
    </div>
    <div class="login-title">Panel de Limpieza</div>
    <div class="login-subtitle">Iniciá sesión con tu cuenta de Google para ver qué hay que limpiar y preparar cada día.</div>
    <button class="btn-google" id="btn-login">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#fff" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#ffffffcc" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#ffffffaa" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#ffffffdd" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
      Iniciar sesión con Google
    </button>
  </div>
</div>

<!-- ACCESO DENEGADO -->
<div id="denied-screen">
  <div class="denied-card">
    <div class="denied-icon">🚫</div>
    <div class="denied-title">Acceso Denegado</div>
    <div class="denied-msg" id="denied-msg">Tu cuenta no está habilitada. Contactá al administrador.</div>
    <button class="btn-logout" id="btn-denied-logout">Cerrar sesión</button>
  </div>
</div>

<!-- CARGANDO -->
<div id="loading-screen">
  <div class="spinner"></div>
  <span id="loading-msg">Verificando acceso…</span>
</div>

<!-- APP -->
<div id="app">

  <!-- HEADER -->
  <div class="app-header">
    <div class="app-header-top">
      <div class="app-header-brand">
        <div class="header-logo-box">🧹</div>
        <div class="header-brand-info">
          <div class="header-brand-name">La Pausa</div>
          <div class="header-brand-title">Panel de Limpieza</div>
        </div>
      </div>
      <div class="header-actions">
        <a href="widget.html" class="btn-widget" title="Ver Calendario">
          📅 <span>Calendario</span>
        </a>
        <img class="user-avatar" id="user-avatar" src="" alt="">
        <button class="btn-signout" id="btn-signout">Salir</button>
      </div>
    </div>

    <!-- Fecha grande -->
    <div class="header-date-bar">
      <div class="header-date-main" id="header-date-main"></div>
      <div class="header-date-sub" id="header-date-sub"></div>
    </div>

    <!-- Navegación de días -->
    <div class="date-nav">
      <button class="btn-nav" id="btn-prev" title="Día anterior">&#8592;</button>
      <div class="date-nav-label" id="date-nav-label">Hoy</div>
      <button class="btn-nav" id="btn-next" title="Día siguiente">&#8594;</button>
    </div>
  </div>

  <div class="app-body" id="app-body">
    <div style="display:flex;justify-content:center;padding:40px 0;">
      <div class="spinner"></div>
    </div>
  </div>
</div>

<script type="module">
// ═══════════════════════════════════════════════════
// FIREBASE CONFIG
// ═══════════════════════════════════════════════════
const FB = {
  apiKey:            "AIzaSyBe0h2TWO5oBS4WxeJVoC37PKbyz1jmJiU",
  authDomain:        "alojaapp-8ed45.firebaseapp.com",
  projectId:         "alojaapp-8ed45",
  storageBucket:     "alojaapp-8ed45.firebasestorage.app",
  messagingSenderId: "763636738474",
  appId:             "1:763636738474:web:661dd264664b468c2ae3d3"
};

import { initializeApp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs, doc, getDoc }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const fireApp  = initializeApp(FB, 'limpieza');
const db       = getFirestore(fireApp);
const auth     = getAuth(fireApp);
const provider = new GoogleAuthProvider();

// ── Datos en memoria ──
let alojamientosData = [];
let reservasData     = [];
let dataCargada      = false;

// ── Offset de días (0 = hoy, -1 = ayer, +1 = mañana, …) ──
let offsetDias = 0;

// ── Screens ──
const S = {
  login:   document.getElementById('login-screen'),
  denied:  document.getElementById('denied-screen'),
  loading: document.getElementById('loading-screen'),
  app:     document.getElementById('app')
};

function show(name) {
  ['login','denied','loading','app'].forEach(k => {
    S[k].style.display = k === name ? (k === 'app' ? 'block' : 'flex') : 'none';
  });
}

// ── Buttons login/logout ──
document.getElementById('btn-login').addEventListener('click', async () => {
  try {
    show('loading');
    document.getElementById('loading-msg').textContent = 'Iniciando sesión…';
    await signInWithPopup(auth, provider);
  } catch(e) {
    show('login');
    alert('Error al iniciar sesión: ' + e.message);
  }
});
document.getElementById('btn-signout').addEventListener('click', () => signOut(auth));
document.getElementById('btn-denied-logout').addEventListener('click', () => signOut(auth));

// ── Navegación de días ──
document.getElementById('btn-prev').addEventListener('click', () => {
  offsetDias--;
  actualizarHeaderFecha();
  renderCards(alojamientosData, reservasData);
});
document.getElementById('btn-next').addEventListener('click', () => {
  offsetDias++;
  actualizarHeaderFecha();
  renderCards(alojamientosData, reservasData);
});

// ── Auth state ──
onAuthStateChanged(auth, async (user) => {
  if (!user) { show('login'); return; }

  show('loading');
  document.getElementById('loading-msg').textContent = 'Verificando acceso…';

  const isEnabled = await checkUsuario(user.email);
  if (!isEnabled) {
    document.getElementById('denied-msg').textContent =
      'Tu cuenta (' + user.email + ') no está habilitada. Contactá al administrador.';
    show('denied');
    return;
  }

  document.getElementById('user-avatar').src = user.photoURL || '';
  actualizarHeaderFecha();
  show('app');
  await cargarDatos();
});

// ── Verificar usuario habilitado ──
async function checkUsuario(email) {
  try {
    if (email === 'lapausa.santarosa@gmail.com') return true;
    const uDoc = await getDoc(doc(db, 'usuarios', email));
    if (uDoc.exists() && uDoc.data().approved === true) return true;
    const snap = await getDocs(collection(db, 'usuarios'));
    for (const d of snap.docs) {
      const data = d.data();
      const docEmail = (data.email || d.id || '').toLowerCase();
      if (docEmail === email.toLowerCase() && data.approved === true) return true;
    }
    return false;
  } catch(e) {
    console.error('Error verificando usuario:', e);
    return false;
  }
}

// ── Header fecha ──
function actualizarHeaderFecha() {
  const fecha = fechaConOffset(offsetDias);
  const hoyReal = isoFecha(new Date());
  const esFechaHoy = isoFecha(fecha) === hoyReal;
  const esPasado   = isoFecha(fecha) < hoyReal;

  const optsLargo = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
  const fechaStr  = fecha.toLocaleDateString('es-AR', optsLargo);
  // Capitalizar primera letra
  const fechaCap  = fechaStr.charAt(0).toUpperCase() + fechaStr.slice(1);

  document.getElementById('header-date-main').textContent = fechaCap;

  let subText = '';
  if (offsetDias === 0) subText = 'Hoy';
  else if (offsetDias === -1) subText = 'Ayer';
  else if (offsetDias === 1) subText = 'Mañana';
  else if (esPasado) subText = Math.abs(offsetDias) + ' días atrás';
  else subText = 'En ' + offsetDias + ' días';
  document.getElementById('header-date-sub').textContent = subText;

  // Etiqueta en el nav
  let navLabel = '';
  if (offsetDias === 0) {
    navLabel = 'Hoy <span class="date-badge-hoy">HOY</span>';
  } else if (esPasado) {
    navLabel = fechaCap.split(',')[0] + ' <span class="date-badge-pasado">PASADO</span>';
  } else {
    navLabel = fechaCap.split(',')[0] + ' <span class="date-badge-futuro">FUTURO</span>';
  }
  document.getElementById('date-nav-label').innerHTML = navLabel;
}

// ── Cargar datos (una sola vez) ──
async function cargarDatos() {
  try {
    const [snapAloj, snapRes] = await Promise.all([
      getDocs(collection(db, 'alojamientos')),
      getDocs(collection(db, 'reservas'))
    ]);
    alojamientosData = snapAloj.docs.map(d => ({ id: d.id, ...d.data() }));
    reservasData     = snapRes.docs.map(d => ({ id: d.id, ...d.data() }));
    dataCargada = true;
    renderCards(alojamientosData, reservasData);
  } catch(e) {
    console.error('Error cargando datos:', e);
    document.getElementById('app-body').innerHTML =
      '<div style="text-align:center;padding:40px;color:#6b7280;">⚠️ Error al cargar datos. <button onclick="location.reload()" style="color:#6d40c4;background:none;border:none;cursor:pointer;font-family:inherit;font-weight:600;">Reintentá</button></div>';
  }
}

// ── Render principal ──
function renderCards(alojamientos, reservas) {
  const body = document.getElementById('app-body');

  // Fecha visualizada
  const fechaVista = fechaConOffset(offsetDias);
  const hoyStr     = isoFecha(fechaVista);

  // "Ayer" relativo a la fecha vista
  const ayerDate = new Date(fechaVista);
  ayerDate.setDate(ayerDate.getDate() - 1);
  const ayerStr = isoFecha(ayerDate);

  // Solo reservas activas
  const activas = reservas.filter(r => r.estado !== 'cancelada' && r.estado !== 'bloqueado');

  // Ordenar alojamientos por nombre
  const ordenados = [...alojamientos].sort((a, b) =>
    (a.nombre || '').localeCompare(b.nombre || '', 'es')
  );

  if (ordenados.length === 0) {
    body.innerHTML = '<div style="text-align:center;padding:40px;color:#6b7280;"><div style="font-size:2rem;margin-bottom:8px;">🏠</div>No hay alojamientos cargados.</div>';
    return;
  }

  const cardsHtml = ordenados.map(aloj => buildCard(aloj, activas, hoyStr, ayerStr)).join('');

  body.innerHTML = cardsHtml + buildFooterBtns();
}

// ── Card por alojamiento ──
function buildCard(aloj, activas, hoy, ayer) {
  const id           = aloj.id;
  const nombre       = aloj.nombre || id;
  const color        = aloj.color  || '#6d40c4';
  const maxHuespedes = aloj.maxHuespedes || aloj.capacidad || '?';

  // Reserva de "ayer" (día anterior a la fecha vista)
  const resAyer    = activas.filter(r => r.alojId === id && r.entrada <= ayer && r.salida > ayer);
  const ocupadoAyer = resAyer.length > 0;
  const mascotaAyer = resAyer.some(r => r.mascota === 'si' || r.mascota === true);

  // Reserva del día visto
  const resHoy          = activas.filter(r => r.alojId === id && r.entrada <= hoy && r.salida > hoy);
  const tieneReservaHoy = resHoy.length > 0;
  const resHoyObj       = tieneReservaHoy ? resHoy[0] : null;

  // Personas
  const personasHoy = resHoyObj
    ? ((resHoyObj.adultos || 0) + (resHoyObj.menores || 0)) || resHoyObj.personas || '?'
    : null;

  // Lógica de estado
  let statusIcon = '';
  let statusText = '';
  let badgeClass = '';
  let badgeLabel = '';

  if (ocupadoAyer && tieneReservaHoy) {
    statusIcon = '🧹';
    statusText = 'Limpiar y preparar para ' + personasHoy + ' persona' + (personasHoy !== 1 ? 's' : '');
    badgeClass = 'badge-limpiar';
    badgeLabel = 'LIMPIAR Y PREPARAR';
  } else if (ocupadoAyer && !tieneReservaHoy) {
    statusIcon = '🧹';
    statusText = 'Limpiar y preparar para máxima capacidad (' + maxHuespedes + ' personas)';
    badgeClass = 'badge-limpiar';
    badgeLabel = 'LIMPIAR';
  } else if (!ocupadoAyer && tieneReservaHoy) {
    statusIcon = '🛏️';
    statusText = 'No hay que limpiar, pero preparar para ' + personasHoy + ' persona' + (personasHoy !== 1 ? 's' : '');
    badgeClass = 'badge-preparar';
    badgeLabel = 'SOLO PREPARAR';
  } else {
    statusIcon = '✅';
    statusText = 'Sin nada para hacer en este alojamiento';
    badgeClass = 'badge-nada';
    badgeLabel = 'LIBRE';
  }

  // Plataforma
  let plataformaHtml = '';
  if (resHoyObj) {
    const origen = (resHoyObj.origen || resHoyObj.plataforma || '').toLowerCase();
    const msg = 'Tener en cuenta los detalles para la futura evaluación';
    if (origen.includes('airbnb')) {
      plataformaHtml = '<div class="tag-plataforma"><span>⭐</span><span>Airbnb — ' + msg + '</span></div>';
    } else if (origen.includes('booking')) {
      plataformaHtml = '<div class="tag-plataforma"><span>⭐</span><span>Booking — ' + msg + '</span></div>';
    }
  }

  // Observaciones
  let obsHtml = '';
  if (resHoyObj && resHoyObj.observaciones && resHoyObj.observaciones.trim()) {
    obsHtml = '<div class="tag-obs">📝 ' + escHtml(resHoyObj.observaciones.trim()) + '</div>';
  }

  // Mascota ayer (relativo a día visto)
  let mascotaHtml = '';
  if (mascotaAyer) {
    mascotaHtml = '<div class="tag-pet"><span>🐾</span> El día anterior hubo mascota en este alojamiento</div>';
  }

  // Huésped que entra hoy
  let entradaHtml = '';
  if (resHoyObj && resHoyObj.entrada === hoy) {
    const huespNombre = resHoyObj.huespedNombre || resHoyObj.nombre || '';
    if (huespNombre) {
      entradaHtml = (
        '<div class="status-row">' +
          '<span class="status-icon">👤</span>' +
          '<span class="status-text">Huésped: ' + escHtml(huespNombre) + '</span>' +
        '</div>'
      );
    }
  }

  return (
    '<div class="aloj-card">' +
      '<div class="aloj-card-header">' +
        '<div class="aloj-color-dot" style="background:' + color + '"></div>' +
        '<div class="aloj-nombre">' + escHtml(nombre) + '</div>' +
        '<span class="badge ' + badgeClass + '">' + badgeLabel + '</span>' +
      '</div>' +
      '<div class="aloj-card-body">' +
        '<div class="status-row">' +
          '<span class="status-icon">' + statusIcon + '</span>' +
          '<span class="status-text">' + statusText + '</span>' +
        '</div>' +
        entradaHtml +
        plataformaHtml +
        obsHtml +
        mascotaHtml +
      '</div>' +
    '</div>'
  );
}

function buildFooterBtns() {
  return (
    '<div class="footer-btns">' +
      '<button class="btn-refresh" onclick="recargar()">🔄 Actualizar datos</button>' +
      '<a href="widget.html" class="btn-cal-footer">📅 Ver Calendario</a>' +
    '</div>'
  );
}

// Recarga datos sin recargar la página
async function recargar() {
  document.getElementById('app-body').innerHTML =
    '<div style="display:flex;justify-content:center;padding:40px 0;"><div class="spinner"></div></div>';
  await cargarDatos();
}
window.recargar = recargar;

// ── Helpers ──
function fechaConOffset(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d;
}

function isoFecha(d) {
  const y   = d.getFullYear();
  const m   = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
